# Deliberately left at the default. The cmux hooks below focus a workspace, and
# this also cds the invoking shell. Both move, on purpose: when no matching
# workspace exists (worktrees predating the hooks), the cd is the only thing
# that still gets you there.
[switch]
cd = true

[list]
json-schema = 2

# Generate commit messages for uncommitted work during wt merge.
[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

# One cmux workspace per worktree, titled <repo>/<branch>.
# Hooks must stay pre-*: cmux only allows socket access from processes spawned
# inside a cmux terminal, and post-* hooks run detached, breaking that lineage.
[pre-start]
cmux = "cmux workspace create --name {{ repo | sanitize }}/{{ branch | sanitize }} --cwd {{ worktree_path }} --focus true"

# Match on title OR directory. Title catches workspaces this config created;
# directory catches ones you opened by hand, whose auto-generated titles drift
# as cmux renames them.
[pre-switch]
cmux = """
WS=$(cmux --json workspace list 2>/dev/null \\
  | jq -r --arg t '{{ repo | sanitize }}/{{ branch | sanitize }}' \\
        --arg p '{{ worktree_path }}' \\
      '.workspaces[] | select(.title == $t or .current_directory == $p) | .ref' | head -1)
[ -n "$WS" ] && cmux workspace select --workspace "$WS" || true
"""

# Never close the workspace we're running in. User hooks run before project
# hooks, so closing our own workspace here would kill this `wt` process before
# the project's pre-remove cleanup (Docker volumes) ever runs. Leaves a stale
# workspace behind when you remove the worktree you're standing in; close it by
# hand. A visible stale tab beats invisible orphaned volumes.
[pre-remove]
cmux = """
WS=$(cmux --json workspace list 2>/dev/null \\
  | jq -r --arg t '{{ repo | sanitize }}/{{ branch | sanitize }}' \\
        --arg p '{{ worktree_path }}' \\
        --arg self "$CMUX_WORKSPACE_ID" \\
      '.workspaces[] | select((.title == $t or .current_directory == $p) and .id != $self) | .ref' | head -1)
[ -n "$WS" ] && cmux workspace close --workspace "$WS" || true
"""
