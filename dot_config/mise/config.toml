java = "openjdk-25.0.2"
node = "26.13.0"
python = "3.14"

"go:github.com/d-kuro/gwq/cmd/gwq" = "latest"

"npm:@askalf/dario" = "latest"
"npm:@ccusage/codex" = "latest"
"npm:@playwright/cli" = "latest"
"npm:@playwright/test" = "latest"
"npm:carbonyl" = "0.0.2-next.bacf3db"
"npm:context-mode" = "latest"
"npm:defuddle" = "latest"
