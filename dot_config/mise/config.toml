"npm:neovim" = "latest"
"npm:vercel" = "latest"

"pypi:ccswap" = "latest"
"pypi:claude-swap" = "latest"
"pypi:langsmith-fetch" = "latest"
"pypi:poetry" = "latest"
"pypi:posting" = "latest"
